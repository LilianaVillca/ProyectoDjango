<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista de libros</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #fff;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        a {
            color: #007BFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        button {
            background: #007BFF;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Lista de libros</h1>
    <ul>
        {% for book in books %}
        <li>{{ book.title }} por {{ book.author }} (Publicado: {{ book.published_date }}) - 
            <a href="{% url 'update_book' book.id %}">Actualizar</a> | 
            <a href="{% url 'delete_book' book.id %}">Eliminar</a></li>
        {% endfor %}
    </ul>
    <a href="{% url 'create_book' %}">Crear un nuevo libro</a>
</body>
</html>
