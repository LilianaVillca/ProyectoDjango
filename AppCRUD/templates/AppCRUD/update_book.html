<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Actualizar Libro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            /* display: flex; */
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            justify-content: center;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background: #007BFF;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #0056b3;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .formu{
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <h1>Actualizar Libro</h1>
    <dvi class="formu">
        <form method="post">
            {% csrf_token %}
            <label for="title">Título:</label>
            <input type="text" id="title" name="title" value="{{ book.title }}" required><br>
            <label for="author">Autor:</label>
            <input type="text" id="author" name="author" value="{{ book.author }}" required><br>
            <label for="published_date">Fecha de Publicación:</label>
            <input type="date" id="published_date" name="published_date" value="{{ book.published_date }}" required><br>
            <button type="submit">Actualizar</button>
        </form>
    </dvi>

</body>

</html>
